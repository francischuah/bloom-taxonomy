<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#086b97"><meta name="description" content="Offline-friendly Bloom taxonomy verb lookup and CLO checker"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Bloom Taxonomy · Academic Reference</title><style>
:root{--blue:#066e9d;--teal:#0896b0;--ink:#13233a;--muted:#607286;--bg:#f2f7fb;--line:#e3eaf1;--shadow:0 8px 28px #142f4a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #74caff;outline-offset:2px}.app{max-width:640px;margin:auto;min-height:100dvh;padding-bottom:calc(85px + env(safe-area-inset-bottom))}.hero{background:linear-gradient(130deg,#07518d,#059bb3);color:white;padding:calc(28px + env(safe-area-inset-top)) 22px 38px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;background:#ffffff12;top:-160px;right:-70px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;opacity:.85;text-transform:uppercase}.hero h1{font-size:29px;letter-spacing:-.7px;line-height:1.15;margin:8px 0}.hero p{margin:0;opacity:.88;font-size:14px}.content{padding:20px;display:grid;gap:15px}.card{background:white;border-radius:18px;padding:18px;box-shadow:var(--shadow);border:1px solid #e7edf3}.tile{display:flex;gap:15px;align-items:center;width:100%;text-align:left;border:1px solid #e7edf3;background:white;border-radius:18px;padding:19px;box-shadow:var(--shadow)}.tile strong{font-size:17px}.tile small{display:block;color:var(--muted);font-size:13px;margin-top:3px}.tile .arrow{margin-left:auto;font-size:24px;color:#8293a4}.circle{border-radius:15px;background:#e0f6ea;color:#087d4d;width:51px;height:51px;flex-shrink:0;display:grid;place-items:center;font-size:25px}.tile:nth-child(2) .circle{background:#e5f0ff;color:#0968ca}.tile:nth-child(3) .circle{background:#f0eafe;color:#7655c5}.sectiontitle{font-size:21px;font-weight:800;letter-spacing:-.35px;margin:0}.sub{color:var(--muted);font-size:13px;margin:3px 0 0}.field{width:100%;padding:13px 15px;border:1px solid #cfdbe6;border-radius:12px;background:#fff;color:var(--ink)}textarea.field{resize:vertical;min-height:122px}.label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.filters{display:flex;gap:7px;overflow-x:auto;padding:3px 0}.filter{border:1px solid #d9e5ef;border-radius:99px;padding:7px 13px;background:white;white-space:nowrap;color:#586c80}.filter.active{background:#066ed5;border-color:#066ed5;color:white}.list{display:grid;gap:8px}.listrow{background:white;border:1px solid var(--line);width:100%;border-radius:13px;padding:13px;display:flex;align-items:center;text-align:left;gap:11px}.listrow .name{font-weight:700;text-transform:capitalize}.listrow .end{margin-left:auto;color:#6f8497;font-size:13px}.pills{display:flex;gap:5px;flex-wrap:wrap}.pill{font-weight:800;font-size:12px;background:#ddecff;color:#0953a5;border-radius:8px;padding:4px 8px;white-space:nowrap}.pill.A{background:#f4e7f9;color:#8545a5}.pill.P{background:#d9f6e7;color:#137a58}.button{background:#096fea;border:0;color:#fff;border-radius:12px;padding:13px 16px;font-weight:800;width:100%}.button.secondary{background:#eaf3ff;color:#075aac}.muted{color:var(--muted)}.notice{background:#fff7e6;border:1px solid #f0dfa9;padding:13px;border-radius:12px;color:#805a0d;font-size:13px}.success{background:#eaf8ef;border:1px solid #c7edd3;padding:16px;border-radius:14px}.warning{background:#fff5e4;border:1px solid #f5dba2;padding:16px;border-radius:14px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:640px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #dfe8f0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -6px 26px #192c400c}.nav button{background:transparent;border:0;color:#748394;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;font-size:11px}.nav button.active{color:#066ed5;font-weight:800}.nav .ico{font-size:22px}.hide{display:none!important}.result-title{font-size:23px;font-weight:850;line-height:1.25}.levelitem{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #edf1f4;padding:12px 0}.levelitem:last-child{border:0}.small{font-size:13px}.empty{text-align:center;padding:30px 14px;color:var(--muted)}.tag{display:inline-block;background:#edf4fa;color:#43627d;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:750;margin:3px 3px 0 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.sp{height:8px}#installHint{font-size:13px}details summary{cursor:pointer;font-weight:700}details p{overflow-wrap:anywhere}@media(min-width:750px){.app{margin:20px auto;border-radius:24px;overflow:hidden;min-height:calc(100dvh - 40px);box-shadow:0 16px 80px #112c4b19}.nav{max-width:640px}}
</style></head><body><div class="app"><header class="hero"><div class="eyebrow">Quick academic reference</div><h1 id="pageTitle">Bloom Taxonomy</h1><p id="pageSubtitle">Find the right learning outcome verb.</p></header><main class="content" id="page" aria-live="polite"></main></div><nav class="nav" aria-label="Main navigation"><button data-go="home" class="active"><span class="ico">⌂</span>Home</button><button data-go="indicator"><span class="ico">⌕</span>Indicator</button><button data-go="checker"><span class="ico">☷</span>Checker</button><button data-go="levels"><span class="ico">▱</span>Levels</button></nav><script src="data.js?v=1.4"></script><script>
'use strict';const db=window.BLOOM_DATA;const byVerb=new Map(db.verbs.map(x=>[x.verb,x]));let route='home',filter='All',query='',levelDomain='C',detail=null,cloValue='';const page=document.getElementById('page');const titles={home:['Bloom Taxonomy','Practical, quick and easy to use.'],indicator:['Verb Indicator','Find an action verb and its likely taxonomy levels.'],checker:['CLO Checker','Rule-based guidance for course learning outcomes.'],levels:['Browse Levels','Explore cognitive, affective and psychomotor domains.'],detail:['Verb Classification','Review level associations and assessment guidance.']};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function chips(x){return x.map(l=>`<span class="pill ${l[0]}">${esc(l)}</span>`).join('')};function openRoute(r){route=r;render();window.scrollTo(0,0)};document.querySelector('.nav').addEventListener('click',e=>{let b=e.target.closest('button[data-go]');if(b)openRoute(b.dataset.go)});function render(){let [a,b]=titles[route];document.getElementById('pageTitle').textContent=a;document.getElementById('pageSubtitle').textContent=b;document.querySelectorAll('.nav button').forEach(n=>n.classList.toggle('active',n.dataset.go===(route==='detail'?'indicator':route)));if(route==='home')home();if(route==='indicator')indicator();if(route==='levels')levels();if(route==='detail')verbDetail();if(route==='checker')checker()}
const APP_VERSION='1.4';
// Spelling aliases are lookup-only; original verb records and levels stay untouched.
// Only map alternate spellings to existing source verbs. Never infer levels from spelling.
const SPELLING_PAIRS = [
  ['analyse','analyze'],['organise','organize'],['reorganise','reorganize'],
  ['recognise','recognize'],['summarise','summarize'],['categorise','categorize'],
  ['generalise','generalize'],['memorise','memorize'],['criticise','criticize'],
  ['utilise','utilize'],['synthesise','synthesize'],['theorise','theorize'],
  ['dramatise','dramatize']
];
const spellingAliases = new Map();
for (const [uk,us] of SPELLING_PAIRS) {
  if (byVerb.has(uk) && !byVerb.has(us)) spellingAliases.set(us,uk);
  else if (byVerb.has(us) && !byVerb.has(uk)) spellingAliases.set(uk,us);
}
function resolveVerb(spelling) {
  const key=String(spelling||'').toLowerCase().trim();
  return byVerb.get(key) || byVerb.get(spellingAliases.get(key)) || null;
}
function verbSpellings(verb) {
  const matches=[verb];
  for(const [alias,canonical] of spellingAliases) if(canonical===verb)matches.push(alias);
  return matches;
}
function matchesVerbSearch(record,needle) {
  return verbSpellings(record.verb).some(w=>w.includes(needle));
}
function containsVerb(text,record) {
  return verbSpellings(record.verb).some(w=>
    new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(text)
  );
}

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;updateInstallHint()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallHint()});
function isInstalled(){return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true}
async function handleInstall(){if(isInstalled())return;const ua=navigator.userAgent||'';if(/iPad|iPhone|iPod/i.test(ua)){alert('iPhone / iPad: Open this page in Safari. Tap Share, then Add to Home Screen. Confirm Add.');return}if(deferredInstallPrompt){const prompt=deferredInstallPrompt;deferredInstallPrompt=null;prompt.prompt();await prompt.userChoice;updateInstallHint();return}alert(/Android/i.test(ua)?'Android: Open the site in Chrome. Tap the three-dot menu (⋮), then Install app or Add to Home screen.':'In a supported browser, use its menu to install this app or add it to your home screen.')}

function updateInstallHint(){
  const hint=document.getElementById('installHint');
  const version=document.getElementById('appVersion');
  if(version)version.textContent=`Version ${APP_VERSION}`;
  if(!hint)return;
  const ua=navigator.userAgent||'';
  const isApple=/iPhone|iPad|iPod/i.test(ua) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const installed=window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  if(installed){hint.textContent='Installed on your home screen. Open the app anytime from its icon.';const b=document.getElementById('installApp');if(b)b.hidden=true;return;}
  if(isApple){hint.textContent='iPhone / iPad: Open in Safari → Share → Add to Home Screen.';return;}
  if(isAndroid){hint.textContent='Android: Open in Chrome → menu (⋮) → Install app or Add to Home screen.';return;}
  hint.textContent='Home-screen shortcut: iPhone (Safari) → Share → Add to Home Screen. Android (Chrome) → menu (⋮) → Install app or Add to Home screen.';
}
function home(){page.innerHTML=`<button class="tile" data-go="indicator"><span class="circle">▤</span><span><strong>Verb Indicator</strong><small>Search verbs and check Bloom's levels</small></span><span class="arrow">›</span></button><button class="tile" data-go="checker"><span class="circle">◎</span><span><strong>CLO Checker</strong><small>Review the action verb in a learning outcome</small></span><span class="arrow">›</span></button><button class="tile" data-go="levels"><span class="circle">▱</span><span><strong>Browse Levels</strong><small>Explore all 18 taxonomy levels</small></span><span class="arrow">›</span></button><div class="card"><strong>Built for convenient reference</strong><p class="sub">${db.verbs.length} verbs · 18 levels · Works without an AI subscription</p><p class="small muted" id="installHint" aria-live="polite"></p><button type="button" class="button secondary" id="installApp" style="margin-top:12px">Install App / Add to Home Screen</button><p class="sub" id="appVersion" style="margin-top:10px"></p></div>`;page.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>openRoute(b.dataset.go)));updateInstallHint();page.querySelector('#installApp').addEventListener('click',handleInstall)}
function indicator(){page.innerHTML=`<section class="card"><label class="label" for="search">Search a verb</label><input id="search" class="field" type="search" autocomplete="off" placeholder="e.g. define, analyse, evaluate" value="${esc(query)}"><div class="sp"></div><div class="filters" id="filters">${['All','Cognitive','Affective','Psychomotor'].map(d=>`<button class="filter ${d===filter?'active':''}" data-filter="${d}">${d}</button>`).join('')}</div></section><div class="row"><strong id="count"></strong><span class="small muted">A–Z</span></div><div id="verbList" class="list"></div>`;page.querySelector('#search').addEventListener('input',e=>{query=e.target.value;updateVerbList()});page.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;page.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));updateVerbList()});updateVerbList()}
function updateVerbList(){const k={Cognitive:'C',Affective:'A',Psychomotor:'P'}[filter];const arr=db.verbs.filter(v=>matchesVerbSearch(v,query.toLowerCase().trim())&&(!k||v.levels.some(l=>l[0]===k)));page.querySelector('#count').textContent=`${arr.length} matching verbs`;page.querySelector('#verbList').innerHTML=arr.length?arr.slice(0,150).map(v=>`<button class="listrow" data-verb="${esc(v.verb)}"><span class="pills">${chips(v.levels)}</span><span class="name">${esc(v.verb)}</span><span class="end">›</span></button>`).join(''):'<div class="card empty">No matching verb found. Try a different form of the verb.</div>';page.querySelectorAll('[data-verb]').forEach(b=>b.onclick=()=>{detail=b.dataset.verb;openRoute('detail')})}
function verbDetail(){const v=byVerb.get(detail);if(!v){openRoute('indicator');return}page.innerHTML=`<button class="button secondary" id="back">← Back to verb search</button><section class="card"><div class="small muted">Action verb</div><div class="result-title" style="text-transform:capitalize">${esc(v.verb)}</div><div class="sp"></div><strong>Reference classifications</strong><div class="pills" style="margin-top:8px">${chips(v.levels)}</div>${v.needsReview?'<p class="notice">This verb has differing mappings in the source tables. Review the source file before relying on its classification.</p>':''}<p class="sub">A verb can be associated with more than one level or domain. Select according to the performance expected of the student.</p></section>${v.levels.map(l=>{let x=db.levels[l];return `<section class="card"><div class="row"><span class="pill ${l[0]}">${l}</span><strong>${esc(x.name)}</strong></div>${x.description?`<p class="small">${esc(x.description)}</p>`:'<p class="sub">Refer to the intended learning task to confirm classification.</p>'}${x.methods?`<details><summary>Suggested assessment methods (source)</summary><p class="small muted">${esc(x.methods)}</p></details>`:''}</section>`}).join('')}<div class="notice">Taxonomy association is a reference, not a guarantee that an assessment measures this level.</div>`;page.querySelector('#back').onclick=()=>openRoute('indicator')}
function levels(){let d={C:'Cognitive',A:'Affective',P:'Psychomotor'};page.innerHTML=`<div class="filters">${Object.keys(d).map(k=>`<button data-domain="${k}" class="filter ${k===levelDomain?'active':''}">${d[k]}</button>`).join('')}</div><div id="levelList"></div>`;page.querySelectorAll('[data-domain]').forEach(b=>b.onclick=()=>{levelDomain=b.dataset.domain;levels()});page.querySelector('#levelList').innerHTML=Object.entries(db.levels).filter(([k])=>k[0]===levelDomain).map(([k,v])=>`<section class="card"><div class="row"><span class="pill ${k[0]}">${k}</span><h2 class="sectiontitle" style="font-size:18px">${esc(v.name)}</h2></div><p class="small muted">${esc(v.description||'Review the reference material for this level.')}</p><details><summary>Associated verbs (${db.verbs.filter(x=>x.levels.includes(k)).length})</summary><p>${db.verbs.filter(x=>x.levels.includes(k)).map(x=>`<span class="tag">${esc(x.verb)}</span>`).join('')}</p></details></section>`).join('')}
const vague=new Set(['know','understand','learn','appreciate','be aware','be familiar','familiarise','familiarize','grasp','be knowledgeable']);const lead=/^(?:by the end of (?:this |the )?(?:course|module|lesson)[^,]*,?\s*)?(?:students?\s+(?:will|should|shall)\s+be\s+able\s+to\s+|students?\s+(?:will|should|shall)\s+|to\s+)?/i;
function checker(){page.innerHTML=`<section class="card"><label class="label" for="clo">Enter a course learning outcome</label><textarea id="clo" class="field" maxlength="800" placeholder="e.g. Analyse the factors influencing consumer purchasing decisions.">${esc(cloValue)}</textarea><p class="sub">Suggested format: action verb + subject/content + context (where relevant).</p><div class="sp"></div><button id="check" class="button">Check CLO</button></section><div id="cloResult"></div><div class="notice">This is a rule-based screening aid, not an automated academic approval. It cannot determine assessment alignment or understand a CLO as an AI model would.</div>`;page.querySelector('#clo').oninput=e=>cloValue=e.target.value;page.querySelector('#check').onclick=checkClo}
function checkClo(){const out=page.querySelector('#cloResult');let text=cloValue.trim();if(!text){out.innerHTML='<div class="warning">Please enter a CLO statement first.</div>';return}let simplified=text.toLowerCase().replace(/^[^a-z]+/,'').replace(lead,'').trim();let words=simplified.match(/[a-z]+(?:-[a-z]+)*/g)||[];let first=words[0]||'';let candidates=db.verbs.filter(v=>containsVerb(simplified,v));let preferred=resolveVerb(first);let detected=preferred||candidates[0];let vagueWord=[...vague].find(w=>simplified.startsWith(w+' ')||simplified===w||simplified.startsWith(w+' the'));let multi=candidates.length>1;let issue=[];if(vagueWord)issue.push('The opening verb describes a broad or internal state rather than a clearly observable performance.');if(!detected)issue.push('No recognised action verb was found in the reference database.');else if(!preferred&&!vagueWord)issue.push('A recognised verb appears in the statement, but not at the expected opening position. Review the CLO structure.');if(words.length<=1)issue.push('A single action verb is not a complete CLO. Add the subject or content and expected student performance.');else if(text.length<28)issue.push('This statement is quite short; verify that the learning content is sufficiently specific.');if(multi)issue.push('Multiple action verbs were detected. Consider whether the CLO expects more than one separately assessable performance.');if(detected?.needsReview)issue.push('The source workbook contains inconsistent classifications for this verb.');let good=issue.length===0;let suggestions=[];if(vagueWord)suggestions.push('Replace the vague opening verb with an observable action such as explain, describe, analyse or demonstrate, depending on the expected student performance.');if(!detected)suggestions.push('Start with a clear action verb and specify what the learner must demonstrate.');if(words.length<=1&&detected)suggestions.push('The verb is recognised in the taxonomy reference, but a full CLO must describe what students should demonstrate.');if(!suggestions.length)suggestions.push('Confirm that the planned assessment actually requires the indicated cognitive, affective or psychomotor performance.');out.innerHTML=`<section class="${good?'success':'warning'}"><strong>${good?'Recognised verb · preliminary screening passed':'Review suggested'}</strong><p class="small">${good?'No basic wording issue was detected. This does not validate the entire CLO.':issue.map(esc).join(' ')}</p><div class="row"><div><div class="small muted">Detected action verb</div><strong style="text-transform:capitalize">${esc(detected?.verb||vagueWord||'Not found')}</strong></div><div><div class="small muted">Possible levels</div><div class="pills">${detected?chips(detected.levels):'—'}</div></div></div></section><section class="card"><strong>Suggested next step</strong><p class="small">${esc(suggestions.join(' '))}</p>${detected&&detected.levels.length>1?'<p class="small muted">Multiple possible levels: use the actual performance and assessment to select the appropriate level.</p>':''}</section>`}
render();
// Refresh an open page once when a new worker takes control. Avoid reload loops.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  let controllerRefreshPending = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!controllerRefreshPending) { controllerRefreshPending = true; location.reload(); }
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', {updateViaCache:'none'})
      .then(reg => {
        reg.update().catch(() => {});
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      }).catch(() => {});
  });
}
</script></body></html>
